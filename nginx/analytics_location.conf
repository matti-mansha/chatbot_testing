# /etc/nginx/conf.d/mila-analytics-location.conf (OR inserted into the
# :443 server block of /etc/nginx/sites-available/mila-dashboard)
#
# Adds a direct-download path for the analytics JSONL event stream so
# downstream partners can fetch it over HTTPS with the same Basic Auth
# credentials they already use for the dashboard.
#
# NOT installed automatically by install_nginx.sh yet — drop this file
# into conf.d/ or splice into the site config, then `sudo nginx -t &&
# sudo systemctl reload nginx`.
#
# After install, files at /home/ubuntu/chatbot_testing/logs/analytics/*
# are reachable at:
#     https://<host>/analytics/events_YYYYMMDD.jsonl
#     https://<host>/analytics/           (directory listing, auth-gated)

location /analytics/ {
    alias /home/ubuntu/chatbot_testing/logs/analytics/;
    auth_basic           "MILA Analytics";
    auth_basic_user_file /etc/nginx/htpasswd-mila;

    # Serve .jsonl as text/plain so browsers don't try to prettify
    # or download it with a weird extension
    types {
        application/x-ndjson    jsonl;
        application/gzip        gz;
        text/plain              txt;
    }
    default_type application/x-ndjson;

    # Enable directory listing so partners can see what's available
    autoindex on;
    autoindex_exact_size off;   # human-readable file sizes
    autoindex_localtime on;

    # These files can be large (10s of MB) — allow full-speed transfer
    sendfile on;
    tcp_nopush on;
    gzip_static off;            # let the client decide compression

    # Cache for 30 seconds so concurrent partner pulls don't hammer the
    # filesystem during a bulk rsync
    expires 30s;
    add_header Cache-Control "private, max-age=30";
}
